# Liora's signed GRUB image is the same on every computer: it reads the Liora
# menu that grub-mkconfig writes to grub/grub.cfg on the EFI system partition
# this image was started from ($cmdpath), and never from another disk (a USB
# stick with its own grub/grub.cfg cannot take over the boot).
regexp --set=1:root '^\(([^)]*)\)' "$cmdpath"
set prefix=($root)/grub
configfile $prefix/grub.cfg
